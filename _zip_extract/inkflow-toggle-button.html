<!-- ========================================
     INKFLOW THEME TOGGLE BUTTON
     Button HTML + CSS pour intégration facile
     ======================================== -->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkFlow Theme Toggle Button</title>
  <style>
    /* Bouton Toggle Thème */
    .theme-toggle {
      position: relative;
      width: 56px;
      height: 28px;
      background: var(--border);
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px var(--shadow-sm);
    }

    .theme-toggle:hover {
      background: var(--border-light);
      transform: scale(1.05);
    }

    .theme-toggle:active {
      transform: scale(0.98);
    }

    /* Slider animé */
    .toggle-slider {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: var(--orange);
      border-radius: 50%;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(255, 140, 0, 0.4);
    }

    /* Position du slider en mode dark */
    .theme-toggle[data-theme="dark"] .toggle-slider {
      transform: translateX(28px);
      box-shadow: 0 2px 6px rgba(255, 149, 0, 0.5);
    }

    /* Icônes Soleil/Lune */
    .toggle-icon {
      width: 14px;
      height: 14px;
      color: white;
      transition: all 0.3s ease;
    }

    .toggle-icon.sun {
      opacity: 1;
      transform: rotate(0deg);
    }

    .toggle-icon.moon {
      position: absolute;
      opacity: 0;
      transform: rotate(180deg);
    }

    /* Animation des icônes en mode dark */
    .theme-toggle[data-theme="dark"] .toggle-icon.sun {
      opacity: 0;
      transform: rotate(-180deg);
    }

    .theme-toggle[data-theme="dark"] .toggle-icon.moon {
      opacity: 1;
      transform: rotate(0deg);
    }

    /* ========================================
       DEMO - Styling de la page (à retirer)
       ======================================== */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .demo-container {
      text-align: center;
      padding: 3rem;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 8px 24px var(--shadow-md);
      transition: all 0.3s ease;
    }

    h1 {
      margin-bottom: 2rem;
      color: var(--text-primary);
    }

    .demo-text {
      margin-top: 1.5rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>🌓 InkFlow Theme Toggle</h1>
    
    <!-- LE BOUTON À COPIER -->
    <button 
      id="theme-toggle-btn" 
      class="theme-toggle" 
      aria-label="Toggle theme"
    >
      <div class="toggle-slider">
        <!-- Icône Soleil (SVG inline) -->
        <svg class="toggle-icon sun" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <!-- Icône Lune (SVG inline) -->
        <svg class="toggle-icon moon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </div>
    </button>

    <p class="demo-text">Cliquez pour changer de thème ✨</p>
  </div>

  <script>
    // Logique du toggle
    function initTheme() {
      const savedTheme = localStorage.getItem('inkflow-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const button = document.getElementById('theme-toggle-btn');
      if (button) {
        button.setAttribute('data-theme', savedTheme);
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('inkflow-theme', newTheme);
      
      const button = document.getElementById('theme-toggle-btn');
      if (button) {
        button.setAttribute('data-theme', newTheme);
      }
    }

    // Initialisation
    initTheme();
    document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
  </script>
</body>
</html>
