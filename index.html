<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');</script>
    <script>
      (function(){var t=localStorage.getItem('inkflow-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(t==='light'){document.documentElement.setAttribute('data-theme','light');}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.setAttribute('data-theme','light');}})();
    </script>
    <meta name="description" content="InkFlow - La plateforme tout-en-un pour tatoueurs. Reservations en ligne, acomptes Stripe, galerie Flash, CRM, messagerie, assistant IA. Gagnez 5 heures par semaine." />
    <meta name="keywords" content="tatoueur, logiciel tatouage, gestion studio tatouage, reservation tatouage, CRM tatoueur, InkFlow" />
    <meta name="author" content="InkFlow" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="InkFlow - Plateforme de gestion pour tatoueurs" />
    <meta property="og:description" content="La plateforme tout-en-un pour tatoueurs. Reservations, paiements Stripe, galerie Flash, CRM, messagerie, IA." />
    <meta property="og:url" content="https://inkflow.app" />
    <meta property="og:site_name" content="InkFlow" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InkFlow - Plateforme pour tatoueurs" />
    <meta name="twitter:description" content="Reservations, paiements, CRM et IA pour studios de tatouage." />
    <meta name="theme-color" content="#ddd6f7" />
    <meta name="apple-mobile-web-app-title" content="InkFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="canonical" href="https://inkflow.app" />
    <title>InkFlow - Plateforme de gestion pour tatoueurs et studios</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "InkFlow",
      "description": "Plateforme de gestion tout-en-un pour tatoueurs et studios de tatouage",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "29",
        "highPrice": "79",
        "priceCurrency": "EUR",
        "offerCount": "2"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "500"
      }
    }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <!-- iOS : PNG avec 20% padding pour masque arrondi. Généré via npm run generate-pwa-icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #ddd6f7;
        --color-surface: #ffffff;
        --color-text: #1a1035;
        --color-muted: #4a3878;
        --color-border: rgba(120, 80, 220, 0.18);
        --color-accent: #6328d4;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-2xl: 32px;
        --shadow-sm: 0 2px 8px rgba(99,40,212,0.10);
        --shadow-md: 0 4px 20px rgba(99,40,212,0.14);
        --shadow-lg: 0 12px 40px rgba(99,40,212,0.18);
        --shadow-xl: 0 24px 64px rgba(99,40,212,0.2);
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: #1a1035;
        color: var(--color-text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d4;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3;
      }
      .splash-screen {
        position: fixed; inset: 0; z-index: 9999;
        background: #000000; display: flex; align-items: center; justify-content: center;
        transition: opacity 0.3s ease;
      }
      .splash-screen.hidden { opacity: 0; pointer-events: none; }
      .splash-content { text-align: center; padding: 0 20px; }
      .splash-logo {
        width: 80px; height: 80px; margin: 0 auto;
        display: block; object-fit: contain;
        border-radius: 20px;
      }
      .splash-loader {
        width: 200px; height: 4px; margin: 20px auto 0; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden;
      }
      .splash-loader::after {
        content: ''; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #fff 0%, rgba(251,191,36,0.9) 100%); border-radius: 4px;
        animation: splash-load 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
</head>
  <body>
    <!-- Critical LCP content: visible before React loads (fixes NO_LCP, FCP) -->
    <div id="splash" class="splash-screen">
      <div class="splash-content">
        <img src="/icon.svg" alt="InkFlow" class="splash-logo" width="80" height="80" fetchpriority="high" />
        <div class="splash-loader"></div>
      </div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
