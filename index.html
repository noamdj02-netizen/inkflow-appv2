    <!-- Fonts: self-hosted via @fontsource (non-blocking, font-display: swap) -->
    <style>
      :root {
        --color-bg: #ddd6f7;
        --color-surface: #ffffff;
        --color-text: #1a1035;
        --color-muted: #4a3878;
        --color-border: rgba(120, 80, 220, 0.18);
        --color-accent: #6328d4;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-2xl: 32px;
        --shadow-sm: 0 2px 8px rgba(99,40,212,0.10);
        --shadow-md: 0 4px 20px rgba(99,40,212,0.14);
        --shadow-lg: 0 12px 40px rgba(99,40,212,0.18);
        --shadow-xl: 0 24px 64px rgba(99,40,212,0.2);
      }
      /* Critical layout — évite chevauchement / mauvais affichage (prod + mobile) */
      html {
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        -webkit-text-size-adjust: 100%;
      }
      body {
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        overflow-x: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      body > #root {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        overflow: hidden;
      }
      .app-root {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow: hidden;
      }
      .app-root > * {
        flex: 1;
        min-height: 0;
        min-width: 0;
      }
      /* Shell structure (dashboard) — évite collapse/overlap si CSS principal charge en retard */
      .app-shell {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .app-shell-row {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .app-shell-main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .app-shell-content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      img, video {
        max-width: 100%;
        height: auto;
        vertical-align: middle;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #ffffff;
        color: var(--color-text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d4;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3;
      }
      .splash-screen {
        position: fixed; inset: 0; z-index: 99999;
        background: #000000; display: flex; align-items: center; justify-content: center;
        transition: opacity 0.3s ease;
        isolation: isolate;
      }
      .splash-screen.hidden { opacity: 0; pointer-events: none; }
      .splash-content { text-align: center; padding: 0 20px; }
      .splash-logo {
        width: 80px; height: 80px; margin: 0 auto;
        display: block; object-fit: contain;
        border-radius: 20px;
      }
      .splash-loader {
        width: 200px; height: 4px; margin: 20px auto 0; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden;
      }
      .splash-loader::after {
        content: ''; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #fff 0%, rgba(251,191,36,0.9) 100%); border-radius: 4px;
        animation: splash-load 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    </style>
</head>
  <body>
    <!-- Critical LCP content: visible before React loads (fixes NO_LCP, FCP) -->
    <div id="splash" class="splash-screen">
      <div class="splash-content">
        <img src="/icon.svg" alt="InkFlow" class="splash-logo" width="80" height="80" fetchpriority="high" />
        <div class="splash-loader"></div>
      </div>
    </div>
    <div id="root"></div>
    <!-- Fallback pour crawlers sans JS (SEO) -->
    <noscript>
      <div style="max-width:800px;margin:2rem auto;padding:2rem;font-family:system-ui,sans-serif;">

        <p>Gérez vos rendez-vous, clients et portfolio de tatouage en un seul endroit. Agenda, acomptes Stripe, galerie flash et CRM.</p>
        <p><a href="/">Accéder au site</a> (JavaScript requis)</p>
      </div>
    </noscript>

</body>
